version: '1.0'
name: sync-release
displayName: Sync GitHub release to Gitee
triggers:
  trigger: manual
stages:
  - stage:
    name: sync
    displayName: Sync release assets
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: sync_release
        displayName: Download GitHub assets and publish to Gitee
        pythonVersion: '3.10'
        commands:
          - python3 -m pip install --upgrade pip
          - python3 -m pip install requests
          - python3 dev/release/sync_gitee_release.py
