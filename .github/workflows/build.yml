name: platform-bundles

on:
  workflow_dispatch:
    inputs:
      cyan_tag:
        description: CYAN release tag (empty = latest)
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: Windows
            arch: x64
            ext: zip
          - runner: ubuntu-22.04
            platform: Linux
            arch: x64
            ext: tar.gz
          - runner: ubuntu-22.04-arm
            platform: Linux
            arch: arm64
            ext: tar.gz
          - runner: macos-15
            platform: macOS
            arch: arm64
            ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve CYAN release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.cyan_tag }}" ]; then
            tag="${{ inputs.cyan_tag }}"
          elif [ -f CYAN_RELEASE ]; then
            tag="$(tr -d '\r\n' < CYAN_RELEASE)"
          else
            tag="$(gh release view --repo Gipsy-The-Sheller/CYAN --json tagName -q .tagName)"
          fi
          echo "CYAN_TAG=$tag" >> "$GITHUB_ENV"

      - name: Verify CYAN pin
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pin = Path("CYAN_RELEASE").read_text(encoding="utf-8").strip()
          manifest = json.loads(Path("cyan_tools.json").read_text(encoding="utf-8"))
          if manifest.get("release") != pin:
              raise SystemExit(
                  "cyan_tools.json release %r does not match CYAN_RELEASE %r"
                  % (manifest.get("release"), pin))
          if pin != "${{ env.CYAN_TAG }}":
              raise SystemExit(
                  "CYAN_RELEASE %r does not match the requested tag %r"
                  % (pin, "${{ env.CYAN_TAG }}"))
          PY

      - name: Download CYAN assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _cyan
          gh release download "$CYAN_TAG" \
            --repo Gipsy-The-Sheller/CYAN \
            --dir _cyan \
            --pattern "*-${{ matrix.platform }}-${{ matrix.arch }}-*" \
            --pattern "bmge-*-Windows-x64-*" \
            --pattern "icytree-*-Windows-x64-*"

      - name: Assemble bundle
        shell: bash
        run: |
          python dev/release/build_platform_bundle.py \
            --assets-dir _cyan \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --format "${{ matrix.ext }}" \
            --tag "$CYAN_TAG" \
            --output "YR-MPE-bins-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: YR-MPE-bins-${{ matrix.platform }}-${{ matrix.arch }}
          path: YR-MPE-bins-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.ext }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Platform bundles built from CYAN $CYAN_TAG" || true
          gh release upload "$GITHUB_REF_NAME" \
            "YR-MPE-bins-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.ext }}" \
            --clobber

  publish-gitee:
    name: Publish to Gitee
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install requests
      - name: Mirror release assets
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_TAG: ${{ github.ref_name }}
        run: python dev/release/sync_gitee_release.py
